<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis - GP Tech Digital</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    background-color: #121212;
    margin: 0;
    color: #fff;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    padding: 10px 0;
  }

  .container-topo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
  }
  
  .visualizer {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #ff4b4b 0%, #b30000 70%); 
    border-radius: 50%;
    box-shadow: 0 0 30px #ff4b4b;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  
  .visualizer.active {
    background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 70%); 
    box-shadow: 0 0 30px #00d2ff;
    animation: pulsar 1.5s infinite;
  }

  @keyframes pulsar {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  #status {
    margin-top: 10px;
    font-size: 15px;
    color: #aaa;
    text-align: center;
  }

  #chat-box {
    width: 95%;
    max-width: 600px;
    height: 50vh;
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mensagem {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .mensagem.user {
    background-color: #2b3a42;
    color: #00d2ff;
    align-self: flex-end;
  }

  .mensagem.jarvis {
    background-color: #2a2a2a;
    color: #fff;
    align-self: flex-start;
  }

  #painel-erros {
    width: 95%;
    max-width: 600px;
    background-color: #2a0000;
    border: 1px solid #ff4b4b;
    border-radius: 8px;
    padding: 10px;
    color: #ff9999;
    font-family: monospace;
    font-size: 12px;
    display: none;
    max-height: 80px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="container-topo">
  <div class="visualizer" id="jarvisVis" title="Toque para ativar/desativar"></div>
  <div id="status">Toque na esfera para iniciar o Jarvis</div>
</div>

<div id="chat-box">
  <div class="mensagem jarvis">Olá, Gabriel! Toque na esfera para iniciar nossa conversa contínua.</div>
</div>

<div id="painel-erros"><strong>LOG DE ERROS:</strong><br></div>

<script>
  const PROMPT_SISTEMA = "Você é o Jarvis, assistente virtual da GP Tech Digital. Aja como um parceiro humano de trabalho. Seja amigável, direto e tenha conversas fluidas. Mantenha suas respostas curtas, pois elas serão lidas em voz alta.";
  
  const vis = document.getElementById('jarvisVis');
  const statusText = document.getElementById('status');
  const painelErros = document.getElementById('painel-erros');
  const chatBox = document.getElementById('chat-box');
  
  let isAtivo = false;
  let historico = []; 
  let vozesDisponiveis = [];
  let recognition = null;

  // PLAYER GLOBAL: Essa é a chave para driblar o bloqueio do iPhone
  const playerDeAudio = new Audio();

  function carregarVozes() {
    if ('speechSynthesis' in window) {
      vozesDisponiveis = window.speechSynthesis.getVoices();
    }
  }
  carregarVozes();
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = carregarVozes;
  }

  function mostrarErro(contexto, erroMensagem) {
    console.error(contexto, erroMensagem);
    painelErros.style.display = 'block';
    painelErros.innerHTML += `> <b>${contexto}:</b> ${erroMensagem}<br><br>`;
    painelErros.scrollTop = painelErros.scrollHeight;
  }

  function adicionarMensagem(remetente, texto) {
    const div = document.createElement('div');
    div.classList.add('mensagem');
    if (remetente === 'Você') {
      div.classList.add('user');
      div.innerText = `Você: ${texto}`;
    } else {
      div.classList.add('jarvis');
      div.innerText = `Jarvis: ${texto}`;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = false; 
    recognition.interimResults = false;

    recognition.onresult = async (event) => {
      const transcricao = event.results[0][0].transcript.trim();
      if (transcricao) {
        adicionarMensagem('Você', transcricao);
        statusText.innerText = 'Pensando...';
        await enviarParaAPI(transcricao);
      }
    };

    recognition.onerror = (event) => {
      if (isAtivo && event.error !== 'no-speech' && event.error !== 'aborted') {
        mostrarErro("Erro no Microfone", event.error);
      }
    };

    recognition.onend = () => {
      if (isAtivo && statusText.innerText.includes('Ouvindo')) {
        try {
          recognition.start();
        } catch(e) {}
      }
    };
  }

  vis.addEventListener('click', () => {
    // DESTRANCA O ÁUDIO AQUI: Toca um som mudo em base64 na exata hora do toque
    playerDeAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
    playerDeAudio.play().catch(e => console.log("Áudio de desbloqueio falhou", e));

    const synth = window.speechSynthesis;
    if (synth) {
      const dummy = new SpeechSynthesisUtterance('');
      synth.speak(dummy);
    }

    isAtivo = !isAtivo;
    if (isAtivo) {
      vis.classList.add('active');
      statusText.innerText = 'Ouvindo... Pode falar.';
      if (recognition) {
        try { recognition.start(); } catch(e) {}
      }
    } else {
      vis.classList.remove('active');
      statusText.innerText = 'Jarvis em repouso. Toque para acordar.';
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      if (synth) synth.cancel();
    }
  });

  async function enviarParaAPI(mensagem) {
    historico.push({ role: "user", parts: [{ text: mensagem }] });

    const url = `/api/jarvis`;
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: PROMPT_SISTEMA }] },
          contents: historico
        })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error || `HTTP Status ${response.status}`);
      }

      const respostaJarvis = data.candidates[0].content.parts[0].text;
      
      historico.push({ role: "model", parts: [{ text: respostaJarvis }] });
      adicionarMensagem('Jarvis', respostaJarvis);
      
      falarEasyVoice(respostaJarvis);
      
    } catch (error) {
      mostrarErro('Erro no Backend/Vercel', error.message);
      const msgErroVoz = "Desculpe, ocorreu um erro de conexão.";
      adicionarMensagem('Jarvis', msgErroVoz);
      falarNativo(msgErroVoz);
    }
  }

  async function falarEasyVoice(texto) {
    statusText.innerText = 'Jarvis gerando voz premium...';
    
    try {
      const response = await fetch('/api/easyvoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: texto })
      });

      const contentType = response.headers.get('content-type');
      if (contentType && contentType.includes('application/json')) {
        const errorData = await response.json();
        throw new Error(`Erro escondido na API: ${JSON.stringify(errorData)}`);
      }

      if (!response.ok) {
        throw new Error(`Erro na API do EasyVoice: ${response.status}`);
      }

      const blob = await response.blob();
      const audioUrl = URL.createObjectURL(blob);
      
      // REUTILIZA O PLAYER GLOBAL que já foi destrancado lá em cima
      playerDeAudio.src = audioUrl;

      playerDeAudio.onended = () => {
        if (isAtivo) {
          statusText.innerText = 'Ouvindo... Pode falar.';
          if (recognition) {
            try { recognition.start(); } catch(e) {}
          }
        }
      };

      playerDeAudio.onerror = () => {
        mostrarErro('Erro no Arquivo de Áudio', 'O arquivo recebido não pôde ser tocado pelo navegador.');
        falarNativo(texto); 
      };

      statusText.innerText = 'Jarvis falando...';
      
      playerDeAudio.play().catch(erro => {
        mostrarErro('Erro ao Tocar (Play)', erro.message);
        falarNativo(texto);
      });

    } catch (error) {
      mostrarErro('Erro EasyVoice', error.message);
      falarNativo(texto); 
    }
  }

  function falarNativo(texto) {
    statusText.innerText = 'Jarvis falando...';
    
    const synth = window.speechSynthesis;
    if (synth.speaking) synth.cancel();

    const utterance = new SpeechSynthesisUtterance(texto);
    window.currentUtterance = utterance;

    if (vozesDisponiveis.length === 0) {
      vozesDisponiveis = synth.getVoices();
    }

    let vozHumana = vozesDisponiveis.find(v => 
      v.lang.includes('pt') && (
        v.name.includes('Voz 1') || 
        v.name.includes('Siri') ||
        v.name.includes('Luciana (Aprimorada)') || 
        v.name.includes('Natural') || 
        v.name.includes('Neural') ||
        v.name.includes('Google português do Brasil')
      )
    );

    if (!vozHumana) {
      vozHumana = vozesDisponiveis.find(v => v.lang.startsWith('pt'));
    }

    if (vozHumana) {
      utterance.voice = vozHumana;
    } else {
      utterance.lang = 'pt-BR';
    }

    utterance.rate = 1.0; 
    utterance.pitch = 0.95;

    utterance.onend = () => {
      if (isAtivo) {
        statusText.innerText = 'Ouvindo... Pode falar.';
        if (recognition) {
          try { recognition.start(); } catch(e) {}
        }
      }
    };

    utterance.onerror = (e) => {
      mostrarErro('Erro na Fala', e.error);
      if (isAtivo) {
        statusText.innerText = 'Ouvindo... Pode falar.';
        if (recognition) {
          try { recognition.start(); } catch(e) {}
        }
      }
    };

    synth.speak(utterance);
  }
</script>

</body>
</html>
