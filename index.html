<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis - GP Tech Digital</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    background-color: #121212;
    margin: 0;
    color: #fff;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    padding: 10px 0;
  }

  .container-topo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 5px;
  }
  
  .visualizer {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, #ff4b4b 0%, #b30000 70%); 
    border-radius: 50%;
    box-shadow: 0 0 25px #ff4b4b;
    transition: all 0.3s ease;
    cursor: pointer;
    margin-bottom: 8px;
  }
  
  .visualizer.active {
    background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 70%); 
    box-shadow: 0 0 25px #00d2ff;
    animation: pulsar 1.5s infinite;
  }

  @keyframes pulsar {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  #seletor-voz {
    background-color: #222;
    color: #00d2ff;
    border: 1px solid #444;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 5px;
    outline: none;
  }

  #status {
    margin-top: 5px;
    font-size: 14px;
    color: #aaa;
    text-align: center;
  }

  #chat-box {
    width: 95%;
    max-width: 600px;
    height: 48vh;
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mensagem {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .mensagem.user {
    background-color: #2b3a42;
    color: #00d2ff;
    align-self: flex-end;
  }

  .mensagem.jarvis {
    background-color: #2a2a2a;
    color: #fff;
    align-self: flex-start;
  }

  #painel-erros {
    width: 95%;
    max-width: 600px;
    background-color: #2a0000;
    border: 1px solid #ff4b4b;
    border-radius: 8px;
    padding: 8px;
    color: #ff9999;
    font-family: monospace;
    font-size: 11px;
    display: none;
    max-height: 70px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="container-topo">
  <div class="visualizer" id="jarvisVis" title="Toque para falar"></div>
  <select id="seletor-voz">
    <option value="ar_m1">Arabic Male 1 (ar_m1)</option>
    <option value="ar_f1">Arabic Female 1 (ar_f1)</option>
    <option value="af_aoede">Voz Padrão (af_aoede)</option>
  </select>
  <div id="status">Toque na esfera para gravar</div>
</div>

<div id="chat-box">
  <div class="mensagem jarvis">Olá, Gabriel! Toque na esfera para gravar sua mensagem.</div>
</div>

<div id="painel-erros"><strong>LOG DE ERROS:</strong><br></div>

<script>
  const PROMPT_SISTEMA = "Você é o Jarvis, assistente virtual da GP Tech Digital. Aja como um parceiro humano de trabalho. Seja amigável, direto e tenha conversas fluidas. Mantenha suas respostas curtas, pois elas serão lidas em voz alta.";
  
  const vis = document.getElementById('jarvisVis');
  const statusText = document.getElementById('status');
  const painelErros = document.getElementById('painel-erros');
  const chatBox = document.getElementById('chat-box');
  const seletorVoz = document.getElementById('seletor-voz');
  
  let historico = []; 
  let mediaRecorder = null;
  let audioChunks = [];
  let gravando = false;
  const playerDeAudio = new Audio();

  function mostrarErro(contexto, erroMensagem) {
    console.error(contexto, erroMensagem);
    painelErros.style.display = 'block';
    painelErros.innerHTML += `> <b>${contexto}:</b> ${erroMensagem}<br><br>`;
    painelErros.scrollTop = painelErros.scrollHeight;
  }

  function adicionarMensagem(remetente, texto) {
    const div = document.createElement('div');
    div.classList.add('mensagem');
    if (remetente === 'Você') {
      div.classList.add('user');
      div.innerText = `Você: ${texto}`;
    } else {
      div.classList.add('jarvis');
      div.innerText = `Jarvis: ${texto}`;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  vis.addEventListener('click', async () => {
    // Desbloqueio obrigatório de áudio para mobile
    playerDeAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
    playerDeAudio.play().catch(e => {});

    if (!gravando) {
      // Iniciar Gravação
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          // Para parar as tracks do mic e liberar o hardware pro próximo ciclo
          stream.getTracks().forEach(track => track.stop());
          
          statusText.innerText = 'Processando áudio...';
          await enviarAudioParaTranscricao(audioBlob);
        };

        mediaRecorder.start();
        gravando = true;
        vis.classList.add('active');
        statusText.innerText = 'Gravando... Toque de novo para enviar.';
      } catch (err) {
        mostrarErro("Erro no Microfone", err.message);
        statusText.innerText = 'Erro ao acessar o microfone';
      }
    } else {
      // Parar Gravação
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      gravando = false;
      vis.classList.remove('active');
    }
  });

  async function enviarAudioParaTranscricao(blob) {
    // Nota: Se o seu backend já aceitar o blob de áudio para STT (Whisper/Gemini Audio), você envia ele direto.
    // Caso queira testar simulando texto por enquanto ou ajustar para sua rota de STT:
    
    // Simulando o fluxo direto de envio para a API principal com texto temporário 
    // (Caso você já tenha uma rota de transcrição no backend, ajuste a rota abaixo para /api/transcrever)
    
    const formData = new FormData();
    formData.append("file", blob, "audio.webm");

    try {
      // Exemplo se você enviar o audioBlob para o backend converter:
      // const responseTranscribe = await fetch('/api/transcrever', { method: 'POST', body: formData });
      // const dataTranscribe = await responseTranscribe.json();
      // const transcricao = dataTranscribe.text;

      // Como o foco principal era o envio via MediaRecorder, caso queira testar a rota padrão do Jarvis com texto direto:
      let transcricao = "Teste de envio por MediaRecorder"; // Substitua pelo retorno real da sua API de transcrição
      
      adicionarMensagem('Você', transcricao);
      statusText.innerText = 'Pensando...';
      await enviarParaAPI(transcricao);

    } catch (error) {
      mostrarErro('Erro no Envio de Áudio', error.message);
      statusText.innerText = 'Toque na esfera para gravar';
    }
  }

  async function enviarParaAPI(mensagem) {
    historico.push({ role: "user", parts: [{ text: mensagem }] });

    try {
      const response = await fetch(`/api/jarvis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: PROMPT_SISTEMA }] },
          contents: historico
        })
      });
      
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP Status ${response.status}`);

      const respostaJarvis = data.candidates[0].content.parts[0].text;
      historico.push({ role: "model", parts: [{ text: respostaJarvis }] });
      adicionarMensagem('Jarvis', respostaJarvis);
      
      falarEasyVoice(respostaJarvis);
      
    } catch (error) {
      mostrarErro('Erro no Backend/Vercel', error.message);
      adicionarMensagem('Jarvis', "Desculpe, ocorreu um erro de conexão.");
      statusText.innerText = 'Toque na esfera para gravar';
    }
  }

  async function falarEasyVoice(texto) {
    statusText.innerText = 'Jarvis gerando voz...';
    const vozEscolhida = seletorVoz.value;
    
    try {
      const response = await fetch('/api/easyvoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: texto, voice: vozEscolhida })
      });

      const contentType = response.headers.get('content-type');
      if (contentType && contentType.includes('application/json')) {
        const errorData = await response.json();
        throw new Error(`Erro na API: ${JSON.stringify(errorData)}`);
      }
      if (!response.ok) throw new Error(`Erro na API do EasyVoice: ${response.status}`);

      const blob = await response.blob();
      playerDeAudio.src = URL.createObjectURL(blob);
      playerDeAudio.volume = 1.0; 

      playerDeAudio.onended = () => {
        statusText.innerText = 'Toque na esfera para gravar';
      };

      playerDeAudio.onerror = () => {
        mostrarErro('Erro no Arquivo de Áudio', 'O arquivo recebido não pôde ser tocado.');
        statusText.innerText = 'Toque na esfera para gravar';
      };

      statusText.innerText = 'Jarvis falando...';
      await playerDeAudio.play();

    } catch (error) {
      mostrarErro('Erro EasyVoice', error.message);
      statusText.innerText = 'Toque na esfera para gravar';
    }
  }
</script>

</body>
</html>
