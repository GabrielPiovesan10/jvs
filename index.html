<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis - GP Tech Digital</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #121212;
    margin: 0;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  
  .visualizer {
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, #ff4b4b 0%, #b30000 70%); 
    border-radius: 50%;
    box-shadow: 0 0 60px #ff4b4b;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  
  .visualizer.active {
    background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 70%); 
    box-shadow: 0 0 60px #00d2ff;
  }

  #status {
    margin-top: 40px;
    font-size: 18px;
    color: #aaa;
  }

  #painel-erros {
    margin-top: 20px;
    width: 80%;
    max-width: 600px;
    background-color: #2a0000;
    border: 1px solid #ff4b4b;
    border-radius: 8px;
    padding: 15px;
    color: #ff9999;
    font-family: monospace;
    font-size: 14px;
    display: none;
    max-height: 150px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="visualizer" id="jarvisVis" title="Clique para ativar/desativar"></div>
<div id="status">Clique na esfera para iniciar o Jarvis</div>

<div id="painel-erros"><strong>LOG DE ERROS:</strong><br></div>

<script>
  const PROMPT_SISTEMA = "Você é o Jarvis, assistente virtual da GP Tech Digital. Aja como um parceiro humano de trabalho. Seja amigável, direto e tenha conversas fluidas. Mantenha suas respostas curtas, pois elas serão lidas em voz alta.";
  
  const vis = document.getElementById('jarvisVis');
  const statusText = document.getElementById('status');
  const painelErros = document.getElementById('painel-erros');
  
  let isAtivo = false;
  let historico = []; 
  let vozesDisponiveis = [];

  function mostrarErro(contexto, erroMensagem) {
    console.error(contexto, erroMensagem);
    painelErros.style.display = 'block';
    painelErros.innerHTML += `> <b>${contexto}:</b> ${erroMensagem}<br><br>`;
    painelErros.scrollTop = painelErros.scrollHeight;
  }

  function carregarVozes() {
    vozesDisponiveis = window.speechSynthesis.getVoices();
  }
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = carregarVozes;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = true; 
  recognition.interimResults = false;

  recognition.onerror = (event) => {
    mostrarErro("Erro no Microfone/Reconhecimento", event.error);
  };

  vis.addEventListener('click', () => {
    isAtivo = !isAtivo;
    if (isAtivo) {
      vis.classList.add('active');
      statusText.innerText = 'Jarvis ouvindo... (Fale normalmente)';
      try {
        recognition.start();
      } catch(e) {
        mostrarErro("Tentativa de iniciar microfone", e.message);
      }
    } else {
      vis.classList.remove('active');
      statusText.innerText = 'Jarvis em repouso. Clique para acordar.';
      recognition.stop();
    }
  });

  recognition.onresult = async (event) => {
    const transcricao = event.results[event.results.length - 1][0].transcript.trim();
    if (transcricao) {
      statusText.innerText = 'Pensando...';
      recognition.stop(); 
      await enviarParaAPI(transcricao);
    }
  };

  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
  .then(stream => {
    const audioContext = new AudioContext();
    const analyser = audioContext.createAnalyser();
    const microphone = audioContext.createMediaStreamSource(stream);
    microphone.connect(analyser);
    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function animate() {
      requestAnimationFrame(animate);
      if (isAtivo) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const average = sum / dataArray.length;
        const scale = 1 + (average / 150);
        vis.style.transform = `scale(${scale})`;
      } else {
        vis.style.transform = `scale(1)`;
      }
    }
    animate();
  }).catch(err => {
    mostrarErro('Permissão de Áudio Negada', err.message);
  });

  async function enviarParaAPI(mensagem) {
    historico.push({ role: "user", parts: [{ text: mensagem }] });

    const url = `/api/jarvis`;
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: PROMPT_SISTEMA }] },
          contents: historico
        })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error || `HTTP Status ${response.status}`);
      }

      const respostaJarvis = data.candidates[0].content.parts[0].text;
      
      historico.push({ role: "model", parts: [{ text: respostaJarvis }] });
      falar(respostaJarvis);
      
    } catch (error) {
      mostrarErro('Erro no Backend/Vercel', error.message);
      falar("Desculpe, ocorreu um erro de conexão com o servidor da Vercel.");
    }
  }

  function falar(texto) {
    statusText.innerText = 'Jarvis falando...';
    
    const synth = window.speechSynthesis;
    
    // Cancela qualquer áudio preso anterior
    if (synth.speaking) {
      synth.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(texto);
    
    // Atualiza a lista de vozes na hora para garantir que acha a Neural do Edge
    const voces = synth.getVoices();
    const vozEdgeNeural = voces.find(voz => 
      voz.name.includes('Online (Natural)') && voz.lang.includes('pt-BR')
    );

    if (vozEdgeNeural) {
      utterance.voice = vozEdgeNeural;
      console.log("Usando voz:", vozEdgeNeural.name);
    } else {
      utterance.lang = 'pt-BR';
    }

    utterance.rate = 1.05; 
    
    utterance.onstart = () => {
      console.log("O navegador começou a emitir o som com sucesso.");
    };

    utterance.onerror = (e) => {
      mostrarErro('Erro no Áudio (TTS)', e.error);
    };

    utterance.onend = () => {
       if (isAtivo) {
         statusText.innerText = 'Jarvis ouvindo... (Fale normalmente)';
         try { recognition.start(); } catch(e) {} 
       }
    };

    // TRUQUE DE OURO: Pequeno delay para burlar a trava de async do navegador
    setTimeout(() => {
      synth.speak(utterance);
    }, 100);
  }
    window.vozAtual = utterance;
    synth.speak(utterance);
  }
</script>

</body>
</html>
