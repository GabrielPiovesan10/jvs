<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis - GP Tech Digital</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    background-color: #121212;
    margin: 0;
    color: #fff;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    padding: 10px 0;
  }

  .container-topo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
  }
  
  .visualizer {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #ff4b4b 0%, #b30000 70%); 
    border-radius: 50%;
    box-shadow: 0 0 30px #ff4b4b;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  
  .visualizer.active {
    background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 70%); 
    box-shadow: 0 0 30px #00d2ff;
  }

  #status {
    margin-top: 10px;
    font-size: 15px;
    color: #aaa;
    text-align: center;
  }

  #chat-box {
    width: 95%;
    max-width: 600px;
    height: 50vh;
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mensagem {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .mensagem.user {
    background-color: #2b3a42;
    color: #00d2ff;
    align-self: flex-end;
  }

  .mensagem.jarvis {
    background-color: #2a2a2a;
    color: #fff;
    align-self: flex-start;
  }

  #painel-erros {
    width: 95%;
    max-width: 600px;
    background-color: #2a0000;
    border: 1px solid #ff4b4b;
    border-radius: 8px;
    padding: 10px;
    color: #ff9999;
    font-family: monospace;
    font-size: 12px;
    display: none;
    max-height: 80px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="container-topo">
  <div class="visualizer" id="jarvisVis" title="Toque para ativar/desativar"></div>
  <div id="status">Toque na esfera para iniciar</div>
</div>

<div id="chat-box">
  <div class="mensagem jarvis">Olá, Gabriel! Toque na esfera acima para conversar comigo.</div>
</div>

<div id="painel-erros"><strong>LOG DE ERROS:</strong><br></div>

<script>
  const PROMPT_SISTEMA = "Você é o Jarvis, assistente virtual da GP Tech Digital. Aja como um parceiro humano de trabalho. Seja amigável, direto e tenha conversas fluidas. Mantenha suas respostas curtas, pois elas serão lidas em voz alta.";
  
  const vis = document.getElementById('jarvisVis');
  const statusText = document.getElementById('status');
  const painelErros = document.getElementById('painel-erros');
  const chatBox = document.getElementById('chat-box');
  
  let isAtivo = false;
  let historico = []; 
  let vozesDisponiveis = [];

  // Carrega as vozes do sistema móvel
  function carregarVozes() {
    if ('speechSynthesis' in window) {
      vozesDisponiveis = window.speechSynthesis.getVoices();
    }
  }
  carregarVozes();
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = carregarVozes;
  }

  function mostrarErro(contexto, erroMensagem) {
    console.error(contexto, erroMensagem);
    painelErros.style.display = 'block';
    painelErros.innerHTML += `> <b>${contexto}:</b> ${erroMensagem}<br><br>`;
    painelErros.scrollTop = painelErros.scrollHeight;
  }

  function adicionarMensagem(remetente, texto) {
    const div = document.createElement('div');
    div.classList.add('mensagem');
    if (remetente === 'Você') {
      div.classList.add('user');
      div.innerText = `Você: ${texto}`;
    } else {
      div.classList.add('jarvis');
      div.innerText = `Jarvis: ${texto}`;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = true; 
  recognition.interimResults = false;

  recognition.onerror = (event) => {
    mostrarErro("Erro no Microfone", event.error);
  };

  // Desbloqueio e ativação por toque no mobile
  vis.addEventListener('click', () => {
    const synth = window.speechSynthesis;
    if (synth) {
      const dummy = new SpeechSynthesisUtterance('');
      synth.speak(dummy);
    }

    isAtivo = !isAtivo;
    if (isAtivo) {
      vis.classList.add('active');
      statusText.innerText = 'Ouvindo... (Fale normalmente)';
      try {
        recognition.start();
      } catch(e) {
        mostrarErro("Erro ao iniciar microfone", e.message);
      }
    } else {
      vis.classList.remove('active');
      statusText.innerText = 'Em repouso. Toque para acordar.';
      recognition.stop();
    }
  });

  recognition.onresult = async (event) => {
    const transcricao = event.results[event.results.length - 1][0].transcript.trim();
    if (transcricao) {
      adicionarMensagem('Você', transcricao);
      statusText.innerText = 'Pensando...';
      recognition.stop(); 
      await enviarParaAPI(transcricao);
    }
  };

  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
  .then(stream => {
    const audioContext = new AudioContext();
    const analyser = audioContext.createAnalyser();
    const microphone = audioContext.createMediaStreamSource(stream);
    microphone.connect(analyser);
    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function animate() {
      requestAnimationFrame(animate);
      if (isAtivo) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const average = sum / dataArray.length;
        const scale = 1 + (average / 150);
        vis.style.transform = `scale(${scale})`;
      } else {
        vis.style.transform = `scale(1)`;
      }
    }
    animate();
  }).catch(err => {
    mostrarErro('Permissão de Áudio Negada', err.message);
  });

  async function enviarParaAPI(mensagem) {
    historico.push({ role: "user", parts: [{ text: mensagem }] });

    const url = `/api/jarvis`;
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: PROMPT_SISTEMA }] },
          contents: historico
        })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error || `HTTP Status ${response.status}`);
      }

      const respostaJarvis = data.candidates[0].content.parts[0].text;
      
      historico.push({ role: "model", parts: [{ text: respostaJarvis }] });
      adicionarMensagem('Jarvis', respostaJarvis);
      falar(respostaJarvis);
      
    } catch (error) {
      mostrarErro('Erro no Backend/Vercel', error.message);
      const msgErroVoz = "Desculpe, ocorreu um erro de conexão.";
      adicionarMensagem('Jarvis', msgErroVoz);
      falar(msgErroVoz);
    }
  }

  // CAÇADOR DE VOZ HUMANA/NEURAL NO CELULAR
  function falar(texto) {
    statusText.innerText = 'Jarvis falando...';
    
    const synth = window.speechSynthesis;
    if (synth.speaking) {
      synth.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(texto);
    window.currentUtterance = utterance;

    // Atualiza a lista caso tenha demorado para carregar
    if (vozesDisponiveis.length === 0) {
      vozesDisponiveis = synth.getVoices();
    }

    // Procura por termos que indicam voz de alta qualidade (Neural, Natural, Google, Wavenet, Enhanced)
    let vozHumana = vozesDisponiveis.find(voz => 
      voz.lang.startsWith('pt') && (
        voz.name.includes('Neural') || 
        voz.name.includes('Natural') || 
        voz.name.includes('Wavenet') || 
        voz.name.includes('Google') || 
        voz.name.includes('Enhanced') ||
        voz.name.includes('Premium')
      )
    );

    // Se não achar nenhuma marcada como avançada, pega a primeira em português disponível
    if (!vozHumana) {
      vozHumana = vozesDisponiveis.find(voz => voz.lang.startsWith('pt'));
    }

    if (vozHumana) {
      utterance.voice = vozHumana;
      console.log("Voz humana ativada:", vozHumana.name);
    } else {
      utterance.lang = 'pt-BR';
    }

    // Ajustes finos para suavizar o tom no celular
    utterance.rate = 1.0; 
    utterance.pitch = 1.0;

    utterance.onend = () => {
       if (isAtivo) {
         statusText.innerText = 'Ouvindo... (Fale normalmente)';
         try { recognition.start(); } catch(e) {} 
       }
    };

    setTimeout(() => {
      synth.speak(utterance);
    }, 100);
  }
</script>

</body>
</html>
