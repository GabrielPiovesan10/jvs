<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - GP Tech</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .status-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }
        .chat-box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 80%;
        }
        .user {
            background: #0056b3;
            align-self: flex-end;
        }
        .assistant {
            background: #2a2a2a;
            align-self: flex-start;
        }
        .sphere-btn {
            background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            align-self: center;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            transition: transform 0.2s;
        }
        .sphere-btn:active {
            transform: scale(0.95);
        }
        .error-log {
            background: #2a0000;
            color: #ff8080;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-box" id="statusText">Toque na esfera para iniciar</div>
        
        <div class="chat-box" id="chatBox">
            <div class="message assistant">Olá, Gabriel! Toque na esfera para iniciar nossa conversa contínua.</div>
        </div>

        <button class="sphere-btn" id="micBtn" onclick="toggleListening()"></button>

        <div class="error-log" id="errorLog"></div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioStream = null;
        let isListening = false;

        const statusText = document.getElementById('statusText');
        const errorLog = document.getElementById('errorLog');

        // Pré-inicializa o microfone para matar o delay no primeiro clique
        async function initMicrophone() {
            if (audioStream) return true;
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                return true;
            } catch (error) {
                console.error("Erro no Microfone:", error);
                showError("Erro no Microfone: audio-capture");
                return false;
            }
        }

        async function toggleListening() {
            if (!isListening) {
                const ready = await initMicrophone();
                if (!ready) return;

                audioChunks = [];
                try {
                    // Reutiliza o stream já autorizado
                    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        processAudioOutput(audioBlob);
                    };

                    mediaRecorder.start();
                    isListening = true;
                    statusText.innerText = "Ouvindo... Pode falar.";
                    errorLog.style.display = 'none';
                } catch (err) {
                    showError("Erro ao iniciar gravação: " + err.message);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
                isListening = false;
                statusText.innerText = "Processando áudio...";
            }
        }

        function processAudioOutput(blob) {
            // Aqui entra a lógica de envio do blob para o seu backend
            console.log("Áudio gravado com sucesso, tamanho:", blob.size);
            statusText.innerText = "Toque na esfera para falar novamente";
        }

        function showError(message) {
            errorLog.innerText = `> ${message}`;
            errorLog.style.display = 'block';
            statusText.innerText = "Erro na captura";
            isListening = false;
        }
    </script>
</body>
</html>
