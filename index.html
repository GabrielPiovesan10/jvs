<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis - GP Tech Digital</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    background-color: #121212;
    margin: 0;
    color: #fff;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    padding: 10px 0;
  }

  .container-topo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 5px;
  }
  
  .visualizer {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, #ff4b4b 0%, #b30000 70%); 
    border-radius: 50%;
    box-shadow: 0 0 25px #ff4b4b;
    transition: all 0.3s ease;
    cursor: pointer;
    margin-bottom: 8px;
  }
  
  .visualizer.active {
    background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 70%); 
    box-shadow: 0 0 25px #00d2ff;
    animation: pulsar 1.5s infinite;
  }

  @keyframes pulsar {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  #seletor-voz {
    background-color: #222;
    color: #00d2ff;
    border: 1px solid #444;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 5px;
    outline: none;
  }

  #status {
    margin-top: 5px;
    font-size: 14px;
    color: #aaa;
    text-align: center;
  }

  #chat-box {
    width: 95%;
    max-width: 600px;
    height: 48vh;
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mensagem {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .mensagem.user {
    background-color: #2b3a42;
    color: #00d2ff;
    align-self: flex-end;
  }

  .mensagem.jarvis {
    background-color: #2a2a2a;
    color: #fff;
    align-self: flex-start;
  }

  #painel-erros {
    width: 95%;
    max-width: 600px;
    background-color: #2a0000;
    border: 1px solid #ff4b4b;
    border-radius: 8px;
    padding: 8px;
    color: #ff9999;
    font-family: monospace;
    font-size: 11px;
    display: none;
    max-height: 70px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="container-topo">
  <div class="visualizer" id="jarvisVis" title="Toque para ativar/desativar"></div>
  <select id="seletor-voz">
    <option value="ar_m1">Arabic Male 1 (ar_m1)</option>
    <option value="ar_f1">Arabic Female 1 (ar_f1)</option>
    <option value="af_aoede">Voz Padrão (af_aoede)</option>
  </select>
  <div id="status">Toque na esfera para iniciar o Jarvis</div>
</div>

<div id="chat-box">
  <div class="mensagem jarvis">Olá, Gabriel! Toque na esfera para iniciar nossa conversa contínua.</div>
</div>

<div id="painel-erros"><strong>LOG DE ERROS:</strong><br></div>

<script>
  const PROMPT_SISTEMA = "Você é o Jarvis, assistente virtual da GP Tech Digital. Aja como um parceiro humano de trabalho. Seja amigável, direto e tenha conversas fluidas. Mantenha suas respostas curtas, pois elas serão lidas em voz alta.";
  
  const vis = document.getElementById('jarvisVis');
  const statusText = document.getElementById('status');
  const painelErros = document.getElementById('painel-erros');
  const chatBox = document.getElementById('chat-box');
  const seletorVoz = document.getElementById('seletor-voz');
  
  let isAtivo = false;
  let estaFalandoOuPensando = false;
  let historico = []; 
  let recognition = null;
  const playerDeAudio = new Audio();

  function mostrarErro(contexto, erroMensagem) {
    console.error(contexto, erroMensagem);
    painelErros.style.display = 'block';
    painelErros.innerHTML += `> <b>${contexto}:</b> ${erroMensagem}<br><br>`;
    painelErros.scrollTop = painelErros.scrollHeight;
  }

  function adicionarMensagem(remetente, texto) {
    const div = document.createElement('div');
    div.classList.add('mensagem');
    if (remetente === 'Você') {
      div.classList.add('user');
      div.innerText = `Você: ${texto}`;
    } else {
      div.classList.add('jarvis');
      div.innerText = `Jarvis: ${texto}`;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = false; 
    recognition.interimResults = false;

    recognition.onresult = async (event) => {
      const transcricao = event.results[0][0].transcript.trim();
      if (transcricao) {
        estaFalandoOuPensando = true;
        adicionarMensagem('Você', transcricao);
        statusText.innerText = 'Pensando...';
        await enviarParaAPI(transcricao);
      }
    };

    recognition.onerror = (event) => {
      if (event.error === 'not-allowed') {
        mostrarErro("Erro no Microfone", "Permissão negada.");
        desativarJarvis();
        return;
      }
      // Ignoramos erros de silêncio (no-speech) para o ciclo continuar natural
      if (isAtivo && !estaFalandoOuPensando && event.error !== 'no-speech' && event.error !== 'aborted') {
        mostrarErro("Erro no Microfone", event.error);
      }
    };

    recognition.onend = () => {
      // Se o sistema ainda está ativo e não está processando/falando, reinicia a escuta de forma limpa
      if (isAtivo && !estaFalandoOuPensando) {
        try {
          recognition.start();
        } catch (e) {
          // Ignora se já estiver rodando
        }
      }
    };
  }

  function desativarJarvis() {
    isAtivo = false;
    estaFalandoOuPensando = false;
    vis.classList.remove('active');
    statusText.innerText = 'Jarvis em repouso. Toque para acordar.';
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    playerDeAudio.pause();
  }

  vis.addEventListener('click', () => {
    // Destrava o áudio nativo mobile
    playerDeAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
    playerDeAudio.play().catch(e => {});

    if (!isAtivo) {
      isAtivo = true;
      estaFalandoOuPensando = false;
      vis.classList.add('active');
      statusText.innerText = 'Ouvindo... Pode falar.';
      if (recognition) {
        try { recognition.start(); } catch(e) {}
      }
    } else {
      desativarJarvis();
    }
  });

  async function enviarParaAPI(mensagem) {
    historico.push({ role: "user", parts: [{ text: mensagem }] });

    try {
      const response = await fetch(`/api/jarvis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: PROMPT_SISTEMA }] },
          contents: historico
        })
      });
      
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP Status ${response.status}`);

      const respostaJarvis = data.candidates[0].content.parts[0].text;
      historico.push({ role: "model", parts: [{ text: respostaJarvis }] });
      adicionarMensagem('Jarvis', respostaJarvis);
      
      falarEasyVoice(respostaJarvis);
      
    } catch (error) {
      mostrarErro('Erro no Backend/Vercel', error.message);
      adicionarMensagem('Jarvis', "Desculpe, ocorreu um erro de conexão.");
      retomarEscuta();
    }
  }

  async function falarEasyVoice(texto) {
    statusText.innerText = 'Jarvis gerando voz...';
    const vozEscolhida = seletorVoz.value;
    
    try {
      const response = await fetch('/api/easyvoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: texto, voice: vozEscolhida })
      });

      const contentType = response.headers.get('content-type');
      if (contentType && contentType.includes('application/json')) {
        const errorData = await response.json();
        throw new Error(`Erro na API: ${JSON.stringify(errorData)}`);
      }
      if (!response.ok) throw new Error(`Erro na API do EasyVoice: ${response.status}`);

      const blob = await response.blob();
      playerDeAudio.src = URL.createObjectURL(blob);
      playerDeAudio.volume = 1.0; 

      playerDeAudio.onended = () => {
        retomarEscuta();
      };

      playerDeAudio.onerror = () => {
        mostrarErro('Erro no Arquivo de Áudio', 'O arquivo recebido não pôde ser tocado.');
        retomarEscuta();
      };

      statusText.innerText = 'Jarvis falando...';
      await playerDeAudio.play();

    } catch (error) {
      mostrarErro('Erro EasyVoice', error.message);
      retomarEscuta();
    }
  }

  function retomarEscuta() {
    estaFalandoOuPensando = false;
    if (isAtivo) {
      statusText.innerText = 'Ouvindo... Pode falar.';
      try {
        recognition.start();
      } catch (e) {
        // Se já estivesse escutando, ignora
      }
    }
  }
</script>

</body>
</html>
