<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis - GP Tech Digital</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100vh;
    background-color: #121212;
    margin: 0;
    color: #fff;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    padding: 10px 0;
  }

  .container-topo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
  }
  
  .visualizer {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #ff4b4b 0%, #b30000 70%); 
    border-radius: 50%;
    box-shadow: 0 0 30px #ff4b4b;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  
  .visualizer.active {
    background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 70%); 
    box-shadow: 0 0 30px #00d2ff;
  }

  #status {
    margin-top: 10px;
    font-size: 15px;
    color: #aaa;
    text-align: center;
  }

  #chat-box {
    width: 95%;
    max-width: 600px;
    height: 50vh;
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mensagem {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .mensagem.user {
    background-color: #2b3a42;
    color: #00d2ff;
    align-self: flex-end;
  }

  .mensagem.jarvis {
    background-color: #2a2a2a;
    color: #fff;
    align-self: flex-start;
  }

  #painel-erros {
    width: 95%;
    max-width: 600px;
    background-color: #2a0000;
    border: 1px solid #ff4b4b;
    border-radius: 8px;
    padding: 10px;
    color: #ff9999;
    font-family: monospace;
    font-size: 12px;
    display: none;
    max-height: 80px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="container-topo">
  <div class="visualizer" id="jarvisVis" title="Toque para ativar/desativar"></div>
  <div id="status">Toque na esfera para iniciar</div>
</div>

<div id="chat-box">
  <div class="mensagem jarvis">Olá, Gabriel! Toque na esfera acima para conversar comigo.</div>
</div>

<div id="painel-erros"><strong>LOG DE ERROS:</strong><br></div>

<script>
  const PROMPT_SISTEMA = "Você é o Jarvis, assistente virtual da GP Tech Digital. Aja como um parceiro humano de trabalho. Seja amigável, direto e tenha conversas fluidas. Mantenha suas respostas curtas, pois elas serão lidas em voz alta.";
  
  const vis = document.getElementById('jarvisVis');
  const statusText = document.getElementById('status');
  const painelErros = document.getElementById('painel-erros');
  const chatBox = document.getElementById('chat-box');
  
  let isAtivo = false;
  let historico = []; 
  let sharedAudio = null;
  let reconhecendo = false; // Trava de segurança para o microfone

  function mostrarErro(contexto, erroMensagem) {
    console.error(contexto, erroMensagem);
    painelErros.style.display = 'block';
    painelErros.innerHTML += `> <b>${contexto}:</b> ${erroMensagem}<br><br>`;
    painelErros.scrollTop = painelErros.scrollHeight;
  }

  function adicionarMensagem(remetente, texto) {
    const div = document.createElement('div');
    div.classList.add('mensagem');
    if (remetente === 'Você') {
      div.classList.add('user');
      div.innerText = `Você: ${texto}`;
    } else {
      div.classList.add('jarvis');
      div.innerText = `Jarvis: ${texto}`;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false; // Desativado contínuo para evitar conflitos no mobile
  recognition.interimResults = false;

  recognition.onstart = () => {
    reconhecendo = true;
  };

  recognition.onend = () => {
    reconhecendo = false;
    // Se o Jarvis ainda estiver ativo e não estiver falando, reinicia a escuta com segurança
    if (isAtivo && statusText.innerText.includes('Ouvindo')) {
      setTimeout(() => {
        if (isAtivo && !reconhecendo) {
          try { recognition.start(); } catch(e) {}
        }
      }, 300);
    }
  };

  recognition.onerror = (event) => {
    reconhecendo = false;
    if (event.error !== 'no-speech' && event.error !== 'aborted') {
      mostrarErro("Erro no Microfone", event.error);
    }
  };

  // Ativação por toque com destrave de áudio e microfone seguros
  vis.addEventListener('click', () => {
    if (!sharedAudio) {
      sharedAudio = new Audio();
    }
    sharedAudio.play().catch(() => {});

    isAtivo = !isAtivo;
    if (isAtivo) {
      vis.classList.add('active');
      statusText.innerText = 'Ouvindo... (Fale normalmente)';
      if (!reconhecendo) {
        try {
          recognition.start();
        } catch(e) {
          mostrarErro("Erro ao iniciar microfone", e.message);
        }
      }
    } else {
      vis.classList.remove('active');
      statusText.innerText = 'Em repouso. Toque para acordar.';
      reconhecendo = false;
      try { recognition.stop(); } catch(e) {}
    }
  });

  recognition.onresult = async (event) => {
    const transcricao = event.results[event.results.length - 1][0].transcript.trim();
    if (transcricao) {
      adicionarMensagem('Você', transcricao);
      statusText.innerText = 'Pensando...';
      try { recognition.stop(); } catch(e) {} 
      await enviarParaAPI(transcricao);
    }
  };

  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
  .then(stream => {
    const audioContext = new AudioContext();
    const analyser = audioContext.createAnalyser();
    const microphone = audioContext.createMediaStreamSource(stream);
    microphone.connect(analyser);
    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function animate() {
      requestAnimationFrame(animate);
      if (isAtivo) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const average = sum / dataArray.length;
        const scale = 1 + (average / 150);
        vis.style.transform = `scale(${scale})`;
      } else {
        vis.style.transform = `scale(1)`;
      }
    }
    animate();
  }).catch(err => {
    mostrarErro('Permissão de Áudio Negada', err.message);
  });

  async function enviarParaAPI(mensagem) {
    historico.push({ role: "user", parts: [{ text: mensagem }] });

    const url = `/api/jarvis`;
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: PROMPT_SISTEMA }] },
          contents: historico
        })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error || `HTTP Status ${response.status}`);
      }

      const respostaJarvis = data.candidates[0].content.parts[0].text;
      
      historico.push({ role: "model", parts: [{ text: respostaJarvis }] });
      adicionarMensagem('Jarvis', respostaJarvis);
      falar(respostaJarvis);
      
    } catch (error) {
      mostrarErro('Erro no Backend/Vercel', error.message);
      const msgErroVoz = "Desculpe, ocorreu um erro de conexão.";
      adicionarMensagem('Jarvis', msgErroVoz);
      falar(msgErroVoz);
    }
  }

  function falar(texto) {
    statusText.innerText = 'Jarvis falando...';
    
    const textoLimpo = texto.length > 200 ? texto.substring(0, 200) : texto;
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(textoLimpo)}&tl=pt-BR&client=tw-ob`;
    
    if (!sharedAudio) {
      sharedAudio = new Audio();
    }

    sharedAudio.src = audioUrl;
    
    sharedAudio.play().then(() => {
      console.log("Áudio reproduzido com sucesso!");
    }).catch(err => {
      mostrarErro('Erro ao reproduzir áudio', err.message);
      falarFallbackNativo(texto);
    });

    sharedAudio.onended = () => {
       if (isAtivo) {
         statusText.innerText = 'Ouvindo... (Fale normalmente)';
         if (!reconhecendo) {
           try { recognition.start(); } catch(e) {} 
         }
       }
    };
  }

  function falarFallbackNativo(texto) {
    const synth = window.speechSynthesis;
    if (synth.speaking) synth.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'pt-BR';
    utterance.rate = 1.05;
    utterance.onend = () => {
      if (isAtivo) {
        statusText.innerText = 'Ouvindo... (Fale normalmente)';
        if (!reconhecendo) {
          try { recognition.start(); } catch(e) {}
        }
      }
    };
    synth.speak(utterance);
  }
</script>

</body>
</html>
